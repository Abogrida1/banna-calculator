<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banna Calorie Tracker | Professional Scientific Calculator</title>
    <meta name="description" content="Calculate your daily calorie needs with high precision using the Mifflin-St Jeor equation. Supports light/dark mode and Arabic/English.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Inter:wght@400;600;800&family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body data-theme="light">
    <div class="loader-overlay" id="loaderOverlay">
        <div class="loader">
            <span><span></span><span></span><span></span><span></span></span>
            <div class="base">
                <span></span>
                <div class="face"></div>
            </div>
        </div>
        <div class="longfazers">
            <span></span><span></span><span></span><span></span>
        </div>
        <p id="loaderText" style="position: absolute; bottom: 30%; font-weight: 600; color: var(--text-primary);"></p>
    </div>

    <div class="container">
        <header>
            <div class="logo">
                <span style="font-weight: 800; font-size: 1.5rem; color: var(--accent-primary);">BANNA</span>
            </div>
            <div class="controls">
                <button class="btn-toggle" id="langToggle">AR</button>
                <button class="btn-toggle" id="themeToggle">
                    <svg id="themeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                </button>
            </div>
        </header>

        <main>
            <div class="main-card">
                <h1 data-i18n="title">Professional Calorie Tracker</h1>
                <p class="subtitle" data-i18n="subtitle">Science-based nutrition analysis</p>

                <form id="calorieForm">
                    <div class="input-row">
                        <div class="input-group">
                            <label data-i18n="age">Age</label>
                            <input type="number" id="age" placeholder="25" required min="15" max="100">
                        </div>
                        <div class="input-group">
                            <label data-i18n="gender">Gender</label>
                            <select id="gender" required>
                                <option value="male" data-i18n="male">Male</option>
                                <option value="female" data-i18n="female">Female</option>
                            </select>
                        </div>
                    </div>

                    <div class="input-row">
                        <div class="input-group">
                            <label data-i18n="height">Height (cm)</label>
                            <input type="number" id="height" placeholder="175" required min="100" max="250">
                        </div>
                        <div class="input-group">
                            <label data-i18n="weight">Weight (kg)</label>
                            <input type="number" id="weight" placeholder="70" required min="30" max="300">
                        </div>
                    </div>

                    <div class="input-group">
                        <label data-i18n="activity">Activity Level</label>
                        <select id="activity" required>
                            <option value="1.2" data-i18n="activity_sedentary">Sedentary (Office job)</option>
                            <option value="1.375" data-i18n="activity_light">Lightly Active (1-3 days/week)</option>
                            <option value="1.55" data-i18n="activity_moderate">Moderately Active (3-5 days/week)</option>
                            <option value="1.725" data-i18n="activity_very">Very Active (6-7 days/week)</option>
                            <option value="1.9" data-i18n="activity_extra">Extra Active (Physical job/2x training)</option>
                        </select>
                    </div>

                    <button type="submit" class="calculate-btn" data-i18n="calculate">Calculate Now</button>
                </form>
            </div>

            <div class="results-card" id="resultsCard">
                <h2 style="text-align: center; margin-bottom: 2rem;" data-i18n="results">Your Results</h2>
                
                <div class="result-item">
                    <span class="result-label" data-i18n="bmr">Basal Metabolic Rate (BMR)</span>
                    <span class="result-value" id="bmrValue">0</span>
                </div>

                <div class="result-item">
                    <span class="result-label" data-i18n="tdee">Daily Calories (TDEE)</span>
                    <div style="text-align: right;">
                        <span class="result-value" id="tdeeValue">0</span>
                        <div style="font-size: 0.8rem; color: var(--text-secondary);" data-i18n="calories_day">Calories / day</div>
                    </div>
                </div>

                <div class="result-item">
                    <span class="result-label" data-i18n="weight_loss">Weight Loss (-500 cal)</span>
                    <span class="result-value" id="lossValue">0</span>
                </div>

                <div class="result-item">
                    <span class="result-label" data-i18n="weight_gain">Weight Gain (+500 cal)</span>
                    <span class="result-value" id="gainValue">0</span>
                </div>

                <div class="result-item">
                    <span class="result-label" data-i18n="bmi">Body Mass Index (BMI)</span>
                    <div style="text-align: right;">
                        <span class="result-value" id="bmiValue">0</span>
                        <div><span class="bmi-badge" id="bmiCategory"></span></div>
                    </div>
                </div>
            </div>
        </main>

        <footer>
            <p data-i18n="footer">Based on the Mifflin-St Jeor Equation</p>
            <p style="margin-top: 0.5rem; opacity: 0.6;">&copy; 2026 Banna Calories Tracker</p>
        </footer>
    </div>

    <script src="main.js"></script>
</body>
</html>
